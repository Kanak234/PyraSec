[project]
name = "pyrasec"
version = "0.1.0"
description = "Repository security, secrets scanning, and compliance audit engine"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741",  # Ambiguous single-letter variable names used in lambda sorting keys (e.g. lambda l: l.index)
]
